services:
  mongodb:
    image: 'mongo:latest'
    container_name: 'meteodatas-mongo-db'
    environment:
      - 'MONGO_INITDB_DATABASE=mydatabase'
      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
    ports:
      - '27017:27017'
    volumes:
      - 'meteodatas-mongo-data:/data/db'
  postgres:
    image: 'postgres:latest'
    container_name: 'meteodatas-postgres-db'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - 'meteodatas-postgres-data:/data/db'
